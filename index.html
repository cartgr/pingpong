<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EconCS PongRank</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏓</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="season-bar" aria-label="Choose a season">
        <div class="season-bar-inner">
            <span class="season-bar-label">Season</span>
            <div id="seasonTabs" class="season-tabs" role="tablist" aria-label="Ping pong seasons"></div>
            <span id="activeSeasonDates" class="season-dates"></span>
        </div>
    </nav>

    <div class="container">
        <h1>EconCS PongRank</h1>

        <div class="section">
            <div class="section-heading">
                <h2 id="rankingsTitle">Season Rankings</h2>
                <span id="seasonMatchCount" class="section-meta"></span>
            </div>
            <div id="rankings" class="rankings">
                <div class="loading">Loading rankings...</div>
            </div>
        </div>

        <div class="section">
            <h2 id="submitMatchTitle">Submit Match Result</h2>
            <p class="section-description">New matches are always added to the current season.</p>
            <form id="matchForm" class="match-form">
                <div class="match-type-toggle" role="group" aria-label="Match type">
                    <button type="button" class="match-type-button active" data-match-type="1v1" aria-pressed="true">1v1</button>
                    <button type="button" class="match-type-button" data-match-type="2v2" aria-pressed="false">2v2</button>
                </div>

                <div class="team-fields">
                    <fieldset class="team-card winner-team-card">
                        <legend>Winner</legend>
                        <div class="form-group">
                            <label for="winner1">Player 1</label>
                            <input type="search" id="winner1" name="winner1" list="playerOptions" placeholder="Type a name" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="next" required>
                        </div>
                        <div class="form-group partner-field" hidden>
                            <label for="winner2">Player 2</label>
                            <input type="search" id="winner2" name="winner2" list="playerOptions" placeholder="Type a name" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="next">
                        </div>
                    </fieldset>

                    <fieldset class="team-card loser-team-card">
                        <legend>Loser</legend>
                        <div class="form-group">
                            <label for="loser1">Player 1</label>
                            <input type="search" id="loser1" name="loser1" list="playerOptions" placeholder="Type a name" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="next" required>
                        </div>
                        <div class="form-group partner-field" hidden>
                            <label for="loser2">Player 2</label>
                            <input type="search" id="loser2" name="loser2" list="playerOptions" placeholder="Type a name" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
                        </div>
                    </fieldset>
                </div>

                <datalist id="playerOptions"></datalist>

                <button type="submit">Submit Match</button>
            </form>

            <div id="message" class="message"></div>
        </div>

        <div class="section">
            <h2>Add New Player</h2>
            <form id="playerForm" class="player-form">
                <div class="form-group">
                    <label for="playerName">Player Name:</label>
                    <input type="text" id="playerName" name="playerName" required>
                </div>
                <button type="submit">Add Player</button>
            </form>
        </div>

        <div class="section">
            <h2 id="matchesTitle">Season Matches</h2>
            <div id="recentMatches" class="recent-matches">
                <div class="loading">Loading matches...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyApPt0veCcYiuU9iR2FeFoEPvsCwXC4xHw",
            authDomain: "pingpong-tracker-5b379.firebaseapp.com",
            databaseURL: "https://pingpong-tracker-5b379-default-rtdb.firebaseio.com",
            projectId: "pingpong-tracker-5b379",
            storageBucket: "pingpong-tracker-5b379.firebasestorage.app",
            messagingSenderId: "476047161408",
            appId: "1:476047161408:web:efcac0a60f5d19e3a007a5"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
    </script>

    <script src="glicko.js"></script>
</body>
</html>
