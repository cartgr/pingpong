<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvard PongRank</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏓</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="season-bar" aria-label="Choose a season">
        <div class="season-bar-inner">
            <span class="season-bar-label">Season</span>
            <div id="seasonTabs" class="season-tabs" role="tablist" aria-label="Ping pong seasons"></div>
            <span id="activeSeasonDates" class="season-dates"></span>
        </div>
    </nav>

    <div class="container">
        <h1>Harvard PongRank</h1>

        <div id="seasonPodium" class="season-podium" hidden></div>

        <div class="section">
            <div class="section-heading">
                <h2 id="rankingsTitle">Season Rankings</h2>
                <span id="seasonMatchCount" class="section-meta"></span>
            </div>
            <div id="rankings" class="rankings">
                <div class="loading">Loading rankings...</div>
            </div>
        </div>

        <div id="matchEntrySection" class="section">
            <h2 id="submitMatchTitle">Submit Match Result</h2>
            <p class="section-description">New matches are always added to the current season.</p>
            <form id="matchForm" class="match-form">
                <div class="match-type-toggle" role="group" aria-label="Match type">
                    <button type="button" class="match-type-button active" data-match-type="1v1" aria-pressed="true">1v1</button>
                    <button type="button" class="match-type-button" data-match-type="2v2" aria-pressed="false">2v2</button>
                </div>

                <div class="team-fields">
                    <fieldset class="team-card winner-team-card">
                        <legend>Winner</legend>
                        <div class="form-group">
                            <label for="winner1">Player</label>
                            <div class="player-picker">
                                <input class="player-search" type="search" id="winner1" name="winner1" placeholder="Search players" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="next" role="combobox" aria-autocomplete="list" aria-expanded="false" required>
                                <div class="player-options" role="listbox" hidden></div>
                            </div>
                        </div>
                        <div class="form-group partner-field" hidden>
                            <label for="winner2">Player 2</label>
                            <div class="player-picker">
                                <input class="player-search" type="search" id="winner2" name="winner2" placeholder="Search players" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="next" role="combobox" aria-autocomplete="list" aria-expanded="false">
                                <div class="player-options" role="listbox" hidden></div>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="team-card loser-team-card">
                        <legend>Loser</legend>
                        <div class="form-group">
                            <label for="loser1">Player</label>
                            <div class="player-picker">
                                <input class="player-search" type="search" id="loser1" name="loser1" placeholder="Search players" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="next" role="combobox" aria-autocomplete="list" aria-expanded="false" required>
                                <div class="player-options" role="listbox" hidden></div>
                            </div>
                        </div>
                        <div class="form-group partner-field" hidden>
                            <label for="loser2">Player 2</label>
                            <div class="player-picker">
                                <input class="player-search" type="search" id="loser2" name="loser2" placeholder="Search players" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" role="combobox" aria-autocomplete="list" aria-expanded="false">
                                <div class="player-options" role="listbox" hidden></div>
                            </div>
                        </div>
                    </fieldset>
                </div>

                <button type="submit">Submit Match</button>
            </form>

            <div id="message" class="message"></div>
        </div>

        <div id="playerEntrySection" class="section">
            <h2>Add New Player</h2>
            <form id="playerForm" class="player-form">
                <div class="form-group">
                    <label for="playerName">Player Name:</label>
                    <input type="text" id="playerName" name="playerName" required>
                </div>
                <button type="submit">Add Player</button>
            </form>
        </div>

        <div class="section">
            <div class="section-heading match-history-heading">
                <h2 id="matchesTitle">Season Matches</h2>
                <div class="recent-matches-controls">
                    <span id="recentMatchLimitLabel">Show</span>
                    <div class="recent-match-limit-picker">
                        <button
                            type="button"
                            id="recentMatchLimitButton"
                            class="recent-match-limit-button"
                            aria-haspopup="listbox"
                            aria-expanded="false"
                            aria-labelledby="recentMatchLimitLabel recentMatchLimitValue"
                        >
                            <span id="recentMatchLimitValue">Last 10</span>
                            <span class="dropdown-caret" aria-hidden="true">▾</span>
                        </button>
                        <div id="recentMatchLimitOptions" class="player-options recent-match-limit-options" role="listbox" aria-labelledby="recentMatchLimitLabel" hidden>
                            <button type="button" class="player-option" role="option" data-match-limit="5">Last 5</button>
                            <button type="button" class="player-option" role="option" data-match-limit="10" aria-selected="true">Last 10</button>
                            <button type="button" class="player-option" role="option" data-match-limit="15">Last 15</button>
                            <button type="button" class="player-option" role="option" data-match-limit="20">Last 20</button>
                            <button type="button" class="player-option" role="option" data-match-limit="50">Last 50</button>
                            <button type="button" class="player-option" role="option" data-match-limit="100">Last 100</button>
                            <button type="button" class="player-option" role="option" data-match-limit="all">All</button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="recentMatches" class="recent-matches">
                <div class="loading">Loading matches...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script src="glicko.js"></script>
</body>
</html>
